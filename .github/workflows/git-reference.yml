name: Git recovery reference checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  recovery-lab:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Show Git version
        run: git --version
      - name: Run offline Git recovery lab in disposable repos
        run: python -B -m unittest discover -s tests -p 'git_recovery_lab.py' -v
